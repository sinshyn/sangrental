
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sangrental-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set password in .env}
    ports:
      - "127.0.0.1:1436:1433"
    volumes:
      - sangrental_sql_data:/var/opt/mssql

volumes:
  sangrental_sql_data:
