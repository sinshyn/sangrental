name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: node scripts/prepare-ui-assets.mjs
      - run: node --test scripts/notifications.test.mjs scripts/ui-policy.test.mjs scripts/fleet-forms.test.mjs
      - run: dotnet restore SangRental.slnx --locked-mode
      - run: dotnet tool restore
      - run: dotnet build SangRental.slnx --no-restore
      - run: dotnet run --project tests/SangRental.Identity.Integration --no-build --no-restore -- --media-only
      - run: dotnet ef migrations has-pending-model-changes --project backend/SangRental.Infrastructure --startup-project backend/SangRental.Api --no-build
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
      - run: node scripts/smoke.mjs
